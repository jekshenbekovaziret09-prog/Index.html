<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Разноцветное сердце</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let w, h;
let cx, cy;
let scale;

const colors = [
    "red",
    "blue",
    "lime",
    "yellow",
    "cyan",
    "magenta",
    "orange",
    "pink"
];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;

    cx = w / 2;
    cy = h / 2;

    scale = Math.min(w, h) / 32;

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, w, h);
}

window.addEventListener("resize", resize);
resize();

let i = 0;

function heartPoint(angle) {
    const x = 16 * Math.pow(Math.sin(angle), 3);

    const y =
        13 * Math.cos(angle)
        - 5 * Math.cos(2 * angle)
        - 2 * Math.cos(3 * angle)
        - Math.cos(4 * angle);

    return {
        x: cx + x * scale,
        y: cy - y * scale
    };
}

function drawStar(x, y, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;

    for (let j = 0; j < 8; j++) {
        const angle = j * Math.PI / 4;

        ctx.beginPath();
        ctx.moveTo(x, y);

        ctx.lineTo(
            x + Math.cos(angle) * 6,
            y + Math.sin(angle) * 6
        );

        ctx.stroke();
    }
}

function animate() {

    const angle = i * Math.PI * 2 / 120;
    const p = heartPoint(angle);

    const color =
        colors[Math.floor(Math.random() * colors.length)];

    // Луч остаётся на экране
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    // Вспышка остаётся
    drawStar(p.x, p.y, color);

    i++;

    // Когда сердце закончено — начинаем снова,
    // но старые цвета НЕ стираются
    if (i >= 120) {
        i = 0;
    }

    setTimeout(() => {
        requestAnimationFrame(animate);
    }, 20);
}

animate();
</script>

</body>
</html>
